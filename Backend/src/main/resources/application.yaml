server:
  port: 3000
spring:
  application:
    name: ticket-api
  profiles:
    active: dev
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 30
    refreshTokenExpiration: 604800
    cookieSecure: false
  google:
    clientId: ${GOOGLE_AUTH_CLIENT_ID:}
    allowedDomain: ""
app:
  cors:
    allowed-origin: http://localhost:4200