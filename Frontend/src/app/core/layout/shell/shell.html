<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-50 flex h-14 items-center gap-3 bg-brand px-4 text-white">
    <h1 class="text-lg font-semibold">Ticket Manager</h1>

    <app-user-menu class="ml-auto" />
  </header>

  <div class="flex flex-1">
    @if (navOpen()) {
      <div
        class="fixed inset-x-0 bottom-0 top-14 z-30 bg-black/40 lg:hidden"
        aria-hidden="true"
        (click)="closeNav()"
      ></div>
    }
      <nav
        id="app-menu"
        aria-label="Main menu"
        class="fixed bottom-0 left-0 top-14 z-40 w-[300px] shrink-0 border-r border-slate-200 bg-slate-50 transition-[transform,visibility] duration-200 ease-out motion-reduce:transition-none max-lg:shadow-xl lg:static lg:visible lg:translate-x-0"
        [class.-translate-x-full]="!navOpen()"
        [class.invisible]="!navOpen()"
      >
        <div class="flex h-full flex-col gap-2 overflow-y-auto p-4">
          @for (item of menuItems; track item.path) {
            @if (item.allowedRoles === null || item.allowedRoles.includes(auth.role() ?? '')) {
              <button
                type="button"
                (click)="menuClick(item.path)"
                class="rounded-md bg-indigo-600 px-4 py-2 text-left text-sm font-medium text-white transition-colors duration-200 hover:bg-indigo-700"
              >
                {{ item.label }}
              </button>
            }
          }
        </div>
        <button
          type="button"
          class="visible absolute left-full top-4 flex h-12 w-7 items-center justify-center rounded-r-md bg-brand text-white shadow hover:bg-brand-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 lg:hidden"
          aria-controls="app-menu"
          [attr.aria-expanded]="navOpen()"
          [attr.aria-label]="navOpen() ? 'Close menu' : 'Open menu'"
          [title]="navOpen() ? 'Close menu' : 'Open menu'"
          (click)="toggleNav()"
        >
          <svg
            viewBox="0 0 20 20"
            class="h-5 w-5 transition-transform duration-200 motion-reduce:transition-none"
            [class.rotate-180]="navOpen()"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 4l6 6-6 6" />
          </svg>
        </button>
    </nav>

    <main class="min-w-0 flex-1 p-6 max-lg:pl-10">
      <router-outlet />
    </main>
  </div>
</div>
