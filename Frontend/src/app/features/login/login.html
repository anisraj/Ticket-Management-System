<div class="mx-auto mt-16 max-w-sm rounded-lg border border-slate-300 p-6">
  <h2 class="text-2xl font-semibold">Login</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
    <div>
      <label for="email" class="block text-sm font-medium">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        formControlName="email"
        class="mt-1 w-full rounded border px-3 py-2"
        [class.border-slate-300]="!errorOf('email')"
        [class.border-red-600]="errorOf('email')"
        [attr.aria-invalid]="errorOf('email') ? 'true' : null"
      />
      @if (errorOf('email'); as message) {
        <p class="mt-1 text-sm text-red-700">{{ message }}</p>
      }
    </div>

    <div>
      <label for="password" class="block text-sm font-medium">Password</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          formControlName="password"
          class="mt-1 w-full rounded border px-3 py-2 pr-16"
          [class.border-slate-300]="!errorOf('password')"
          [class.border-red-600]="errorOf('password')"
          [attr.aria-invalid]="errorOf('password') ? 'true' : null"
        />
        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-sm text-slate-600 hover:underline"
          (click)="togglePassword()"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (errorOf('password'); as message) {
        <p class="mt-1 text-sm text-red-700">{{ message }}</p>
      }
    </div>

    @if (errorMessage()) {
      <p class="rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      class="rounded bg-brand px-4 py-2 text-white hover:bg-brand-light disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="loading()"
    >
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>
    <a
      routerLink="/register"
      class="block rounded border border-brand px-4 py-2 text-center text-brand hover:bg-slate-100"
    >
      Register
    </a>
  </form>
  <div class="my-5 flex items-center gap-3 text-sm text-slate-500">
    <span class="h-px flex-1 bg-slate-300"></span>
    or
    <span class="h-px flex-1 bg-slate-300"></span>
  </div>
  <app-google-button (credential)="loginWithGoogle($event)" />
</div>
